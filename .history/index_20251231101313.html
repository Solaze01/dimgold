<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DimGold - Creative Director & Founder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">D</span>
                <span class="logo-text">DimGold</span>
            </div>
            <div class="nav-links">
                <a href="#works" class="nav-link">Our Works</a>
                <a href="#resume" class="nav-link">Resume</a>
                <a href="#about" class="nav-link">About Us</a>
                <a href="#contact" class="btn-contact">Contact Me</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-container">
            <!-- Large background text -->
            <div class="hero-bg-text" aria-hidden="true">
                <span class="bg-text-line">Dading</span>
                <span class="bg-text-line">Dadi</span>
            </div>

            <!-- Main content -->
            <div class="hero-content">
                <div class="hero-image-container">
                    <img src="hero-image.jpg" alt="DimGold - Creative Director" class="hero-image">
                </div>
                
                <div class="hero-text">
                    <div class="hero-title">
                        <span class="hero-arrow">↘</span>
                        <div class="hero-info">
                            <h1>Founder &<br>Creative Director</h1>
                            <p class="hero-handle">@DimGold</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tagline -->
            <div class="hero-tagline">
                <h2>I design brands and digital experiences</h2>
            </div>

            <!-- Client logos -->
            <div class="clients-section">
                <div class="clients-container">
                    <div class="client-logo">
                        <img src="logo-blue-finance.svg" alt="Blue Finance" class="logo-img">
                    </div>
                    <div class="client-logo">
                        <img src="logo-byte.svg" alt="Byte" class="logo-img">
                    </div>
                    <div class="client-logo">
                        <img src="logo-zappy.svg" alt="Zappy Reality" class="logo-img">
                    </div>
                    <div class="client-logo">
                        <img src="logo-sane.svg" alt="Sane" class="logo-img">
                    </div>
                    <div class="client-logo">
                        <img src="logo-mlensey.svg" alt="Mlensey" class="logo-img">
                    </div>
                </div>
            </div>
        </div>

        <!-- Scroll indicator -->
        <div class="scroll-indicator">
            <div class="scroll-line"></div>
            <span class="scroll-text">Scroll</span>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
