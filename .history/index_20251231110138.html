<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DimGold - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="8" height="20" fill="currentColor"/>
                    <rect x="14" y="2" width="8" height="20" fill="currentColor"/>
                </svg>
                <span>DimGold</span>
            </div>
            <ul class="nav-links">
                <li><a href="#works">Our Works</a></li>
                <li><a href="#resume">Resume</a></li>
                <li><a href="#about">About Us</a></li>
            </ul>
            <button class="contact-btn">Contact Me</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <!-- Scrolling Background Text -->
            <div class="scroll-text-container">
                <div class="scroll-text">
                    <span class="text-slide">Uadire Dad Uadire Dad Uadire Dad </span>
                    <span class="text-slide">Uadire Dad Uadire Dad Uadire Dad </span>
                </div>
            </div>

            <!-- Main Content -->
            <div class="hero-main">
                <div class="hero-image">
                    <img src="https://pikaso.cdnpk.net/private/production/2241430479/render.jpeg?token=exp=1767571200~hmac=306d37f5a58e8c402f94854192d4b1c3fdd8f2e4ddbefb18d05db892e988aa26&preview=1&w=450" alt="DimGold - Creative Director" id="heroImg">
                </div>
                <div class="hero-text">
                    <div class="arrow">↘</div>
                    <h1>Founder &<br>Creative Director<br><span class="highlight">@DimGold</span></h1>
                </div>
            </div>

            <!-- Client Logos -->
            <div class="client-logos">
                <div class="logo-item">
                    <img src="logo1.png" alt="The Creative">
                </div>
                <div class="logo-item">
                    <img src="logo2.png" alt="Byte">
                </div>
                <div class="logo-item">
                    <img src="logo3.png" alt="Simply Fresh">
                </div>
                <div class="logo-item">
                    <img src="logo4.png" alt="Sane">
                </div>
                <div class="logo-item">
                    <img src="logo5.png" alt="Jenasy">
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
