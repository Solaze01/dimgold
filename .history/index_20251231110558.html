<!DOCTYPE html>

<body>

                        <rect x="13" y="0" width="7" height="20" fill="currentColor"/>

    <main class="hero-section">

        <div class="background-text-wrapper">

            <div class="hero-text-container">

        <!-- Client Logos Bar -->
        <div class="clients-bar">
            <div class="clients-container">
                <div class="client-logo">
                    <span>THE<br>CREATIVE</span>
                </div>
                <div class="client-logo">
                    <span>byte</span>
                </div>
                <div class="client-logo">
                    <span>SIMPLY<br>FRESH</span>
                </div>
                <div class="client-logo">
                    <span>Sane</span>
