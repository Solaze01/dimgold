<!DOCTYPE html>

<body>
    <!-- Navigation -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <rect x="0" y="0" width="6" height="18" fill="currentColor"/>
                    <rect x="12" y="0" width="6" height="18" fill="currentColor"/>
                </svg>
                <span>DimGold</span>
            </div>
            <ul class="nav-links">

            <button class="contact-btn">Contact Me</button>

    <section class="hero">

        <div class="hero-wrapper">

                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&h=700&fit=crop&crop=top" alt="DimGold" class="hero-img">
                
                <!-- Text Overlay -->
                <div class="hero-info">
                    <span class="arrow">↘</span>
                    <div class="hero-text">
                        <p>Founder &</p>
                        <p>Creative Director</p>
                        <p class="username">@DimGold</p>

            </div>

        <!-- Client Logos -->
        <div class="clients">
            <div class="client-item">THE<br>CREATIVE</div>
            <div class="client-item">byte</div>
            <div class="client-item">SIMPLY<br>FRESH</div>
